name: Faustus Arbitrage Hourly Check

on:
  schedule:
    # GitHub's "schedule" trigger is best-effort and can be delayed or
    # silently dropped, especially right at the top of the hour (:00-:05)
    # since that's the most congested minute across all of GitHub Actions.
    # To compensate, we check 4 times an hour at off-peak minutes instead
    # of once at the worst one - the script is cheap and safe to run more
    # often than hourly (it just reports "not closed yet" and exits if
    # there's nothing new), so only ONE of these four needs to get through
    # for the hour to be caught.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}  # lets you click "Run workflow" manually to test

permissions:
  contents: write  # needed so the workflow can commit the updated state/ back

concurrency:
  group: faustus-arbitrage-hourly
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run arbitrage check
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          APP_NAME: ${{ vars.APP_NAME }}
          LEAGUE_NAME: ${{ vars.LEAGUE_NAME }}
          REALM: ${{ vars.REALM }}
          MIN_VOLUME_PERCENTILE: ${{ vars.MIN_VOLUME_PERCENTILE }}
          MIN_VOLUME_ABS_FLOOR: ${{ vars.MIN_VOLUME_ABS_FLOOR }}
          MIN_PROFIT_PCT: ${{ vars.MIN_PROFIT_PCT }}
          PERSISTENCE_HOURS: ${{ vars.PERSISTENCE_HOURS }}
          MAX_CYCLES_PER_RUN: ${{ vars.MAX_CYCLES_PER_RUN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m src.main

      - name: Commit updated state
        run: |
          git config user.name "faustus-arb-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "Update arbitrage state"
          git push
